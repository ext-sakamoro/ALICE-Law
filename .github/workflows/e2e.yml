# End to end check of the core ALICE crates, from their crates.io releases
#
# The decisive gate: e2e/tests/law_to_storage_roundtrip.rs reads a law with
# alice-lol, computes with alice-physics, fits and summarises with alice-zip and
# alice-analytics, saves to alice-db, restores, and compares every value bit for bit,
# the law record byte for byte, the alice-crypto digest of the run, the arithmetic
# identifiers and one version per alice-* crate. Resolved against crates.io as it is
# today: it is red until every core crate it needs is published at a version that
# fits the others.
#
# Weekly and on demand, and on a push that changes the check. It does not run on
# pushes to the core crates.

name: End to end (published)

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC, after the dependency check
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      - "scripts/expected_failure.py"
      - "release-train.toml"

permissions:
  contents: read

concurrency:
  group: e2e-published-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  roundtrip:
    name: Read, compute, save, restore, compare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: e2e
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      # a failure the roster lists under [expected-failure.*] (named, explained, until a
      # release) is reported as expected and skips the steps that need it; any other is red
      - name: Resolve against crates.io as it is today
        id: resolve
        run: |
          cargo --version
          python3 ../scripts/expected_failure.py e2e-published-resolve -- cargo generate-lockfile

      - name: The alice crates in the lock file
        if: steps.resolve.outputs.expected != 'true'
        run: grep -A1 '^name = "alice-' Cargo.lock | grep -v '^--$' | paste - - | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: steps.resolve.outputs.expected != 'true'
        run: python3 ../scripts/expected_failure.py e2e-published-test -- cargo test --release --locked -- --nocapture

  digest:
    # f32::max / f32::min leave the sign of an equal-zero result to the target, and
    # x86_64 and aarch64 differ: the released crates must give the same digest on both
    name: Digest on ${{ matrix.arch }}
    needs: roundtrip
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # the test failing as the roster expects leaves no digest; the comparison reads this
    outputs:
      test-expected: ${{ steps.test.outputs.expected }}
    defaults:
      run:
        shell: bash
        working-directory: e2e
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Resolve against crates.io as it is today
        id: resolve
        run: python3 ../scripts/expected_failure.py e2e-published-resolve -- cargo generate-lockfile
      - name: Test and record the digest
        id: test
        if: steps.resolve.outputs.expected != 'true'
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          ALICE_LAW_E2E_DIGEST_OUT="$RUNNER_TEMP/digest-${{ matrix.arch }}" python3 ../scripts/expected_failure.py e2e-published-test -- cargo test --release --locked -- --nocapture
          if [ -f "$RUNNER_TEMP/digest-${{ matrix.arch }}" ]; then cat "$RUNNER_TEMP/digest-${{ matrix.arch }}"; fi
      - if: steps.resolve.outputs.expected != 'true' && steps.test.outputs.expected != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error

  digest-compare:
    name: The same digest on both architectures
    needs: digest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      # the digest jobs skip their test when the resolution fails as the roster expects;
      # then there is nothing to compare, and the same check (not a skip of its own) says so
      - name: Resolve against crates.io as it is today
        id: resolve
        working-directory: e2e
        run: python3 ../scripts/expected_failure.py e2e-published-resolve -- cargo generate-lockfile
      - if: steps.resolve.outputs.expected != 'true' && needs.digest.outputs.test-expected != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Compare
        if: steps.resolve.outputs.expected != 'true' && needs.digest.outputs.test-expected != 'true'
        run: |
          n=$(ls digests | wc -l)
          test "$n" -eq 2 || { echo "expected 2 digests, found $n"; exit 1; }
          cat digests/*
          a=$(cat digests/digest-arm64); b=$(cat digests/digest-x86_64)  # "<the KNOWN_SEMANTICS row of the linked alice-det-math> <digest>"
          test -n "$a" && test "$a" = "$b" || { echo "aarch64 and x86_64 differ"; exit 1; }
          grep -qxF -- "$a" e2e/golden/run.digest || { echo "both differ from the e2e/golden/run.digest line for their KNOWN_SEMANTICS row"; exit 1; }
          echo "aarch64 = x86_64 = golden: $a" >> "$GITHUB_STEP_SUMMARY"
