# Conformance of the release-train crates, read from their main branches
#
# scripts/conformance_roster_check.py in its default mode: every crate that is not exempt
# holds alice-law-conformance.toml at the main of its repository with every gate, valid
# statuses, located fail-known entries, and the committed conformance/manifest-state.toml
# equals what those mains show. A manifest that changed upstream turns this red with the
# command that regenerates the state; the regeneration is a commit in this repository
# (CI does not commit). Nothing compared is a failure.
#
# On every push to main and daily, and on demand. It is not part of the branch / pull
# request checks or the pre-push gate: those run the same script with --internal (the
# committed state alone), so a landing in another repository does not fail a change here.

name: Conformance (live)

on:
  schedule:
    - cron: "23 3 * * *"   # daily 03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-live-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  live:
    name: Every release-train crate declares its conformance at main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the conformance roster checker
        run: python3 scripts/test_conformance_roster_check.py

      - name: Test the landing check of the conformance state
        run: python3 scripts/test_land_law_state.py

      - name: The committed state equals the members' mains
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/conformance_roster_check.py

  # The only rights holder is the author: every public repository of the account, at its default
  # branch, against conformance/holder-baseline.toml (scripts/holder_live.py). A new occurrence or a
  # listed one that is gone is red; a repository that could not be read is red, never a pass.
  # Daily and by hand only: it reads every public repository, not what one change touched.
  holder:
    name: Every public repository names only the author as the rights holder
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the reader
        run: python3 scripts/test_holder_live.py

      - name: The public repositories against the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        # this repository at the commit under test (its own tree), every other one at its default branch
        run: python3 scripts/holder_live.py --local "${GITHUB_REPOSITORY#*/}=."

  # The public text check over every public repository of the account, at its default branch, against
  # conformance/public-text-baseline.toml (scripts/public_text_live.py): a repository that never adopted
  # its own public-text workflow is read here too. The repositories are the ones listed as public at run
  # time. More findings at a place than the baseline has is red, fewer is red (stale), and a repository
  # that could not be read is red, never a pass. Daily and by hand only, like the holder job.
  public-text:
    name: Every public repository against the public text baseline
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      # 3.14, as the Public text workflow: the checker reads zstd streams with the standard library, and a
      # different reader would count different findings than the baseline was made with
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Test the reader
        run: python3 scripts/test_public_text_live.py

      - name: The public repositories against the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        # this repository at the commit under test (its own tree), every other one at its default branch
        run: python3 scripts/public_text_live.py --local "${GITHUB_REPOSITORY#*/}=."

  # G11 (c): conformance/shared-files.toml against GitHub. Each uniform entry's source commit
  # is on its repository's main with the entry's bytes; every listed repository's main
  # carries each uniform copy byte for byte (count-locked on the copies of uniform rows: a
  # row added, removed or settled moves the number here in the same commit, a pending row's
  # copies coming and going as its rollout lands do not); a pending row is
  # listed with its variants and is red only past its time; the discovery pass is red for a
  # file byte-identical in two table repositories with no entry, and for a copy on a main
  # its entry neither lists nor exempts; and the table is what scripts/gen_shared_files.py
  # generates from those mains (a pending row's moving variants are reported, not red).
  # Nothing compared is a failure.
  shared-files:
    name: Every shared file equals the table at each repository's main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the shared-file checker and its generator
        run: |
          python3 scripts/test_shared_files_check.py
          python3 scripts/test_gen_shared_files.py
          python3 scripts/test_shared_files_strict.py

      - name: Each source commit is on main with the entry's bytes
        run: python3 scripts/shared_files_check.py --table conformance/shared-files.toml --fetch

      - name: Every listed repository's main carries each copy
        run: python3 scripts/shared_files_check.py --table conformance/shared-files.toml --live --expect-copies 899

      - name: The table is the generated one
        run: python3 scripts/gen_shared_files.py --table conformance/shared-files.toml --check --lock-file .github/workflows/conformance-live.yml

      # the strict pair on every push to main (an unlisted holder of the same bytes is a finding too): it also runs
      # right before the push, and this is the backstop for a push made without it
      - name: Strict on a push to main (scripts/shared_files_strict.sh)
        if: github.event_name == 'push'
        env:
          # the state checks (conformance_roster_check.py --strict) read the crates' mains through gh api
          GH_TOKEN: ${{ github.token }}
        run: scripts/shared_files_strict.sh
