# The rights-holder baseline on a ci/ branch that changes it or its readers
#
# Conformance (live) reads conformance/holder-baseline.toml daily on main; a ci/ change to the baseline or to its
# readers would otherwise reach main before anything read it. This runs the same check (scripts/holder_live.py
# over every public repository of the account, this repository at the commit under test) with main's baseline and
# with this change's (scripts/live_baseline_delta.py): what the change makes worse, and a repository that could not
# be read, are red; another repository's new occurrence is the daily run's.

name: Holder baseline (ci)

on:
  push:
    branches: ["ci/**"]
    paths:
      - "conformance/holder-baseline.toml"
      - "scripts/holder_live.py"
      - "scripts/licence_files_check.py"
      - "scripts/test_holder_live.py"
      - "scripts/live_baseline_delta.py"
      - "scripts/test_live_baseline_delta.py"
      - ".github/workflows/holder-baseline-ci.yml"

permissions:
  contents: read

concurrency:
  group: holder-baseline-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  holder:
    name: Every public repository names only the author as the rights holder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the reader
        run: python3 scripts/test_holder_live.py

      - name: Test what a baseline change makes worse
        run: python3 scripts/test_live_baseline_delta.py

      # the check with main's baseline and with this change's: only a finding this change adds is red (another
      # repository's growth or a stale entry the daily run on main reports is not this change's)
      - name: The public repositories against the baseline, as far as this change goes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin main:refs/remotes/origin/main
          python3 scripts/live_baseline_delta.py --checker scripts/holder_live.py --baseline conformance/holder-baseline.toml --self "${GITHUB_REPOSITORY#*/}"
