# The rights-holder baseline on a ci/ branch that changes it or its readers
#
# Conformance (live) reads conformance/holder-baseline.toml daily on main; a ci/ change to the baseline or to its
# readers would otherwise reach main before anything read it. This runs the same check (scripts/holder_live.py
# over every public repository of the account, this repository at the commit under test) with main's baseline and
# with this change's (scripts/live_baseline_delta.py): what the change makes worse, and a repository that could not
# be read, are red; another repository's new occurrence is the daily run's.

name: Holder baseline (ci)

on:
  # also on demand, so a run can be had at a commit whose own push did not touch the paths below
  workflow_dispatch:
  push:
    # no paths here: GitHub's filter diffs only the commits new to the repository when a push creates a branch,
    # so a ci/ branch re-pushed with a commit another ref already has got no run; the changes job compares with
    # merge-base(origin/main) instead (patterns: .github/paths/holder-baseline-ci.txt)
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: holder-baseline-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main), a push to main with
  # before..after, another push with merge-base(origin/main)..after;
  # a schedule or manual run always runs; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --patterns-file .github/paths/holder-baseline-ci.txt

  holder:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Every public repository names only the author as the rights holder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0  # the base (scripts/ci_base.py) is read from the history

      - name: Test the reader
        run: python3 scripts/test_holder_live.py

      - name: Test what a baseline change makes worse
        run: python3 scripts/test_live_baseline_delta.py

      # the check with main's baseline and with this change's: only a finding this change adds is red (another
      # repository's growth or a stale entry the daily run on main reports is not this change's)
      - name: The public repositories against the baseline, as far as this change goes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch -q origin main
          base=$(python3 scripts/ci_base.py --event "$EVENT" --ref "$GITHUB_REF" --before "$BEFORE")
          python3 scripts/live_baseline_delta.py --base-ref "$base" --checker scripts/holder_live.py --baseline conformance/holder-baseline.toml --self "${GITHUB_REPOSITORY#*/}"

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, holder]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
