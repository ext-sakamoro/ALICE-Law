# Dependency consistency of the core ALICE crates, from their main branches
#
# Resolves this repository's Cargo.toml (each core crate from its repository's main
# branch) as the mains are today (the committed Cargo.lock is replaced in the runner's
# checkout, never committed), then scripts/dep_consistency.py checks the result: one
# version per alice-* crate, every core crate present, and every alice-* package from
# its repository's main branch (a crates.io release, a commit or tag pin, or another
# branch is a second generation beside main). The report goes to the job summary.
# Nothing compared is a failure.
#
# Weekly and on demand, and on a push that changes the check itself. It does not run
# on pushes to the core crates; a change on a main is picked up by the next weekly run.
#
# The ratchets below compare this tree's conformance/ files with the same files at the base
# scripts/ci_base.py names: on a push to main the commit main stood at before the push (every
# commit of the push is judged), on a ci/ branch the merge-base with main. A weekly or dispatched
# run on main compares main with its parent commit only (HEAD~1).

name: Dependency consistency

on:
  schedule:
    - cron: "41 4 * * 1"   # Mondays 04:41 UTC
  workflow_dispatch:
  push:
    # no paths here: GitHub's filter diffs only the commits new to the repository when a push creates a branch,
    # so a ci/ branch re-pushed with a commit another ref already has got no run; the changes job compares with
    # merge-base(origin/main) instead (patterns: .github/paths/dependency-consistency.txt)
    branches: [main, "ci/**"]

permissions:
  contents: read

concurrency:
  group: dependency-consistency-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main), a push to main with
  # before..after, another push with merge-base(origin/main)..after;
  # a schedule or manual run always runs; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --patterns-file .github/paths/dependency-consistency.txt

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: One version per crate, every alice-* package from its main branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0  # the ratchets' base (scripts/ci_base.py) is read from the history

      - name: Test the checker
        run: python3 scripts/test_dep_consistency.py

      - name: Test the README-names-every-roster-repository checker
        run: python3 scripts/test_readme_roster_check.py

      - name: README names every release-train repository
        run: python3 scripts/readme_roster_check.py

      - name: Test the conformance docs/schema consistency checker
        run: python3 scripts/test_conformance_docs_schema_check.py

      - name: Conformance docs and schema agree
        run: python3 scripts/conformance_docs_schema_check.py

      - name: Test the conformance roster checker
        run: python3 scripts/quiet_tests.py scripts/test_conformance_roster_check.py

      - name: Test the landing check of the conformance state
        run: python3 scripts/quiet_tests.py scripts/test_land_law_state.py

      # a test that leaves the date to the wall clock goes red days after it was written
      - name: The date-aging tests with the clock 10 days ahead (tests, then the run)
        run: |
          python3 scripts/test_run_tests_shifted_clock.py
          python3 scripts/run_tests_shifted_clock.py

      - name: Every step that reaches gh has GH_TOKEN (tests, then check)
        run: |
          python3 scripts/test_workflow_gh_token_check.py
          python3 scripts/workflow_gh_token_check.py

      # G11 (c): the shared-file table's schema and this repository's own copies (offline);
      # the comparison with every listed repository's main is conformance-live.yml
      - name: Test the shared-file checker and its generator
        run: |
          python3 scripts/test_shared_files_check.py
          python3 scripts/test_gen_shared_files.py
          python3 scripts/test_consumer_table_parse.py

      # the line-number reference baseline only goes down (each manifest holds exactly its count; the roster's
      # comparison with every main is conformance-live.yml)
      - name: The ratchets' base (scripts/ci_base.py, shared; tests, then every read of conformance/ uses it)
        run: |
          python3 scripts/test_ci_base.py
          python3 scripts/test_ratchet_base_check.py
          python3 scripts/ratchet_base_check.py

      - name: The line-number reference baseline does not rise (tests, then check against the base)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/test_line_refs_ratchet.py
          python3 scripts/test_line_refs_propose.py
          git fetch -q origin main
          base=$(python3 scripts/ci_base.py --event "$EVENT" --ref "$REF" --before "$BEFORE")
          line_base="$RUNNER_TEMP/base-line-refs-baseline.toml"
          if git cat-file -e "$base":conformance/line-refs-baseline.toml 2>/dev/null; then
            git show "$base":conformance/line-refs-baseline.toml > "$line_base"
          else
            echo "the base $base has no conformance/line-refs-baseline.toml: no ratchet base"
            rm -f "$line_base"
          fi
          python3 scripts/line_refs_ratchet.py --baseline conformance/line-refs-baseline.toml --base "$line_base"

      # pending rows only go down: a change may not add one against the table at the base
      - name: The shared-file table reads, this repository's copies equal it, pending does not rise
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch -q origin main
          base=$(python3 scripts/ci_base.py --event "$EVENT" --ref "$REF" --before "$BEFORE")
          if git cat-file -e "$base":conformance/shared-files.toml 2>/dev/null; then
            git show "$base":conformance/shared-files.toml > "$RUNNER_TEMP/base-shared-files.toml"
            python3 scripts/shared_files_check.py --table conformance/shared-files.toml \
              --base-table "$RUNNER_TEMP/base-shared-files.toml" --lock-file .github/workflows/conformance-live.yml
            # the crates' scripts/test_shared_files.py, at each version a main holds and the target, reads this
            # table (a format change that breaks a version which read the base table is red here, before it lands)
            python3 scripts/consumer_table_parse.py --table conformance/shared-files.toml \
              --base-table "$RUNNER_TEMP/base-shared-files.toml"
          else
            echo "the base $base has no conformance/shared-files.toml: no ratchet base"
            python3 scripts/shared_files_check.py --table conformance/shared-files.toml --lock-file .github/workflows/conformance-live.yml
            python3 scripts/consumer_table_parse.py --table conformance/shared-files.toml
          fi
          python3 scripts/shared_files_check.py --table conformance/shared-files.toml --repo . --name ALICE-Law

      - name: Test main mode (the requirements behind main and what verify counts)
        run: python3 scripts/test_main_mode.py

      # the committed conformance state alone (it parses, covers exactly the train's crates,
      # counts sum to the gates); the comparison with the members' mains is conformance-live.yml,
      # so a manifest landing in another repository does not fail this repository's change
      - name: The committed conformance state is consistent
        run: python3 scripts/conformance_roster_check.py --internal

      - name: Test the README Status generator
        run: python3 scripts/test_gen_law_status.py

      - name: The README Status section is the generated one
        run: python3 scripts/gen_law_status.py --check

      - name: Test the README parity checker
        run: python3 scripts/test_readme_parity_check.py

      - name: README.md and README_JP.md agree where a translation must not differ
        run: python3 scripts/readme_parity_check.py

      - name: Test the README integration block generator
        run: python3 scripts/test_gen_law_readme_block.py

      # the strict workflow reader that workflow_concurrency.py reads the workflows with
      - name: Test the strict workflow reader (scripts/changed_paths.py, shared with the crates' CI)
        run: python3 scripts/test_changed_paths.py

      # a passing test file prints only the unittest summary, so a fixture's findings never sit next to real ones
      - name: Test the quiet test runner (scripts/quiet_tests.py)
        run: python3 scripts/test_quiet_tests.py

      - name: Every branch-triggered workflow has a concurrency group per commit on main
        run: |
          python3 scripts/test_workflow_concurrency.py
          python3 scripts/workflow_concurrency.py

      - name: Every step that pipes runs with pipefail (shared with the crates' CI)
        run: |
          python3 scripts/test_workflow_pipefail.py
          python3 scripts/workflow_pipefail.py

      - name: No pipeline ends in grep -q (shared with the crates' CI)
        run: |
          python3 scripts/test_check_pipe_grep_q.py
          python3 scripts/check_pipe_grep_q.py

      - name: A --locked step that may follow a failed lock file generation requires its success
        run: |
          python3 scripts/test_locked_lockfile_check.py
          python3 scripts/locked_lockfile_check.py

      # the daily keyed pass over the public repositories' new commits runs on main (Conformance (live)); its tests
      # and the acknowledged-hit file it reads are checked here, so neither reaches main unread
      - name: The new-commit reader (tests) and conformance/public-text-commit-ack.toml
        run: |
          python3 scripts/quiet_tests.py scripts/test_public_text_commits_live.py
          python3 scripts/public_text_commits_live.py --check-ack

      - name: The note a push run of Conformance (live) writes on the jobs it skips
        run: |
          python3 scripts/test_live_scope_note.py
          python3 scripts/live_scope_note.py --event push --summary /dev/null

      - name: Test the conformance measurement
        run: python3 scripts/test_measure_conformance.py
      - name: Fold set tool (tests)
        run: python3 scripts/test_fold_set_check.py

      - name: Test the added-function pin check
        run: python3 scripts/quiet_tests.py scripts/test_added_function_pins.py

      # G15: the checker the crates run (fetched at a named revision), its baseline (generated, shrink-only)
      - name: Test the surface-claims check (G15) and its baseline
        run: python3 scripts/test_surface_claims_check.py

      # the proposal of declarations and README tables from what the G15 check finds (structural evidence only)
      - name: Test the surface-claims proposal (G15)
        run: python3 scripts/test_surface_claims_propose.py

      # every file under conformance/ is read by a checker that runs on a ci/ branch (a conformance file whose
      # readers run on main only is red); the crates' reader is tested here, it runs in crates-conformance-ci.yml
      - name: Every conformance file has a reader on ci/** (tests, then the check)
        run: |
          python3 scripts/test_reader_map_core.py
          python3 scripts/test_conformance_reader_map.py
          python3 scripts/conformance_reader_map.py
          python3 scripts/test_crates_conformance_ci.py

      # the publish gate runs cargo semver-checks; its tests run the real tool on two
      # small crates (a breaking change under a minor version must be refused). The
      # release binary is pinned by version and SHA-256, and the toolchain is the one
      # that version reads the rustdoc JSON of.
      - name: Install cargo-semver-checks 0.50.0
        env:
          URL: https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.50.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
          SHA256: 52a65dc88dc53fa8b57d6087954eb52cda149ca03bcfca78ce3fdecd23f893c4
        shell: bash
        run: |
          curl -fsSL "$URL" -o "$RUNNER_TEMP/csc.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/csc.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/csc.tar.gz" -C "$HOME/.cargo/bin" cargo-semver-checks
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 cargo semver-checks --version

      # the roster (release-train.toml): each crate at a commit of its repository's main; its tests
      - name: Test the roster tools
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: |
          python3 scripts/test_release_train.py
          python3 scripts/test_release_train_main.py

      - name: Test the semver gate (scripts/semver_gate.py, shared with the crates' CI)
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python3 scripts/test_semver_gate.py

      - name: Test the release baseline (scripts/release_baseline.py, the semver gate's base under a freeze)
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python3 scripts/test_release_baseline.py

      - name: Test the expected-failure wrapper
        run: python3 scripts/test_expected_failure.py

      - name: Every expected failure is a step a workflow runs
        run: python3 scripts/expected_failure.py --check

      # every row at a commit of its repository's main whose push CI is green (blobless clones keep the
      # history the ancestry check needs)
      - name: Every roster row is at a green main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/roster"
          for r in $(python3 -c "import tomllib; print(' '.join(sorted({c['repo'] for c in tomllib.load(open('release-train.toml', 'rb'))['crate'].values() if c.get('state') == 'main'})))"); do
            git clone --quiet --filter=blob:none --no-checkout "https://github.com/ext-sakamoro/$r.git" "$RUNNER_TEMP/roster/$r"
          done
          python3 scripts/release_train.py check --repos-root "$RUNNER_TEMP/roster" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare the requirement matching with the semver crate
        run: python3 scripts/semver_differential.py

      - name: Resolve the main branches as they are today
        run: |
          cargo --version
          cargo generate-lockfile
          echo "Changes to the committed Cargo.lock:"
          git diff --stat -- Cargo.lock

      - name: Check
        shell: bash
        run: |
          set +e
          python3 scripts/expected_failure.py dependency-consistency -- python3 scripts/dep_consistency.py --roster release-train.toml > "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md"
          exit "$rc"

  g11-table-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # G11: the per-crate table of each pass gate's checker, canary, compared-nothing test and shared rows
    # (conformance/g11.toml in a crate, which fetches this checker and its generator at a pin and runs them
    # on ubuntu, macOS and Windows), so their tests run on the same three
    name: Test the G11 table checker and generator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the G11 table checker
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_g11_table_check.py

      - name: Test the G11 table generator
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_g11_table_gen.py

      - name: Test the G11 self-check
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_g11_self_check.py

      # the self-check's no-panic check builds the real scanner (cargo) and runs it: its binary is
      # no-panic-scan.exe on Windows, so the build, the cache entry and the run are exercised on each lane
      # against a fixture holder with one known site (a row of 0 is a finding, a row of 1 passes); a
      # platform-only break in the checker is red here, not in the holders
      - name: The real no-panic scanner builds and counts a fixture holder
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          cache="$RUNNER_TEMP/no-panic-scan-cache"
          fx="$RUNNER_TEMP/fixture-holder"
          mkdir -p "$fx/src"
          printf '[package]\nname = "fixture"\nversion = "0.0.0"\nedition = "2021"\n' > "$fx/Cargo.toml"
          printf 'pub fn f(x: Option<u8>) -> u8 {\n    x.unwrap()\n}\n' > "$fx/src/lib.rs"
          row='[repo."ALICE-Fixture"]\nexpect = 0\npanic = 0\ntodo = 0\nunimplemented = 0\nunreachable = 0\nassert = 0\nunwrap = %s\n'
          # shellcheck disable=SC2059  # the row is the format: one %s, the unwrap count
          printf "$row" 0 > "$RUNNER_TEMP/row0.toml"
          # shellcheck disable=SC2059
          printf "$row" 1 > "$RUNNER_TEMP/row1.toml"
          "$py" scripts/no_panic_ratchet.py --prepare-scanner --scanner-cache "$cache"
          set +e
          out0=$("$py" scripts/no_panic_ratchet.py --only "ALICE-Fixture=$fx" --baseline "$RUNNER_TEMP/row0.toml" --scanner-cache "$cache" 2>&1); rc0=$?
          out1=$("$py" scripts/no_panic_ratchet.py --only "ALICE-Fixture=$fx" --baseline "$RUNNER_TEMP/row1.toml" --scanner-cache "$cache" 2>&1); rc1=$?
          set -e
          printf '%s\n' "$out0" "$out1"
          [ "$rc0" = 1 ] && [[ "$out0" == *"ALICE-Fixture: unwrap 1 > baseline 0"* ]] \
            || { echo "a row of 0 did not find the fixture's site (exit $rc0)"; exit 1; }
          [ "$rc1" = 0 ] && [[ "$out1" == *"1 production files, 1 sites, 0 finding"* ]] \
            || { echo "a row of 1 did not pass with one site counted (exit $rc1)"; exit 1; }

      # the shared-tests check installs the rustc targets conformance/shared-test-setup.toml declares
      # (rustup target add, the crate's toolchain) before it runs a held test: with real rustup on each
      # lane, a fixture holder whose shared test compiles for every target the fneg test declares passes
      # after the targets not native to the lane were removed, and the same run without the setup fails
      - name: The shared-tests check installs the declared rustc targets on each lane
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          host=$(rustc -vV | awk '$1 == "host:" { print $2 }')
          fx="$RUNNER_TEMP/setup-holder"
          mkdir -p "$fx/scripts"
          printf 'pub fn f(x: u8) -> u8 {\n    x\n}\n' > "$fx/probe.rs"
          cat > "$fx/scripts/test_setup_probe.py" <<'PY'
          import subprocess, sys, tempfile
          targets = sys.argv[1:] or ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
          with tempfile.TemporaryDirectory() as out:
              for t in targets:
                  r = subprocess.run(["rustc", "--crate-type", "lib", "--emit", "llvm-ir", "--target", t,
                                      "--out-dir", out, "probe.rs"], capture_output=True, text=True,
                                     encoding="utf-8", errors="replace")
                  print(t, r.returncode, r.stderr.strip()[-300:])
                  if r.returncode != 0:
                      sys.exit(1)
          PY
          git -C "$fx" init -q
          git -C "$fx" add -A
          git -C "$fx" -c user.name=t -c user.email=t@t commit -q -m fixture
          for t in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            [ "$t" = "$host" ] || rustup target remove "$t" 2>/dev/null || true
          done
          "$py" - "$fx" conformance/shared-test-setup.toml <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import g11_self_check as sc
          fx, law = Path(sys.argv[1]), Path(".")
          if sys.argv[2] != sc.SETUP:  # the declaration this step installs from
              sys.exit(f"{sys.argv[2]} is not the declaration g11_self_check.py reads ({sc.SETUP})")
          need = sc.shared_test_setup(law, law / "conformance/shared-files.toml")["scripts/test_fneg_fma_ir_check.py"]
          tests = ["scripts/test_setup_probe.py"]
          code0, lines0 = sc.run_shared_tests(fx, law, tests, setup={})
          print("without setup:", code0, *lines0, sep="\n  ")
          code1, lines1 = sc.run_shared_tests(fx, law, tests, setup={tests[0]: need})
          print("with setup:", code1, *lines1, sep="\n  ")
          if code1 != 0 or not any(ln.startswith("setup: ") for ln in lines1):
              sys.exit("the declared targets were not installed, or the probe failed after the setup")
          if code0 != 1:
              sys.exit(f"without the setup the probe should fail on this lane (exit {code0})")
          PY

      # a text-mode subprocess call decodes git's output with the locale's code page (cp1252 on
      # Windows) unless it names its encoding; the scripts a crate runs at its pin read UTF-8 files
      - name: Every text-mode subprocess call names its encoding (tests, then check)
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_subprocess_encoding_check.py
          "$py" scripts/subprocess_encoding_check.py

      # the shared harness the crates' checker tests judge their cases with: a crash is reported
      # as a crash (also with the expected exit code and text), a failing case names its text
      - name: Test the checker case harness
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_checker_case.py

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, check, g11-table-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
