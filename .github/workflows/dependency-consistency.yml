# Dependency consistency of the core ALICE crates, from their crates.io releases
#
# Resolves this repository's Cargo.toml against crates.io as it is today (the
# committed Cargo.lock is replaced in the runner's checkout, never committed), then
# scripts/dep_consistency.py checks the result: one version per alice-* crate, every
# core crate present, and every alice-* requirement accepting the latest
# release. The report goes to the job summary. Nothing compared is a failure.
#
# Weekly and on demand, and on a push that changes the check itself. It does not run
# on pushes to the core crates; a new release is picked up by the next weekly run.

name: Dependency consistency

on:
  schedule:
    - cron: "41 4 * * 1"   # Mondays 04:41 UTC
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "release-train.toml"
      - "README.md"
      - "docs/CONFORMANCE.md"
      - "conformance/**"
      - "e2e/golden/run.digest"
      - "e2e/golden/values.digest"
      - "README_JP.md"
      - "scripts/**"
      - ".github/workflows/**"
      - "tools/**"
      - ".github/workflows/dependency-consistency.yml"

permissions:
  contents: read

concurrency:
  group: dependency-consistency-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: One version per crate, requirements accept the latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the checker
        run: python3 scripts/test_dep_consistency.py

      - name: Test the README-names-every-roster-repository checker
        run: python3 scripts/test_readme_roster_check.py

      - name: README names every release-train repository
        run: python3 scripts/readme_roster_check.py

      - name: Test the conformance docs/schema consistency checker
        run: python3 scripts/test_conformance_docs_schema_check.py

      - name: Conformance docs and schema agree
        run: python3 scripts/conformance_docs_schema_check.py

      - name: Test the conformance roster checker
        run: python3 scripts/test_conformance_roster_check.py

      - name: Test the landing check of the conformance state
        run: python3 scripts/test_land_law_state.py

      # a test that leaves the date to the wall clock goes red days after it was written
      - name: The date-aging tests with the clock 10 days ahead (tests, then the run)
        run: |
          python3 scripts/test_run_tests_shifted_clock.py
          python3 scripts/run_tests_shifted_clock.py

      - name: Every step that reaches gh has GH_TOKEN (tests, then check)
        run: |
          python3 scripts/test_workflow_gh_token_check.py
          python3 scripts/workflow_gh_token_check.py

      # G11 (c): the shared-file table's schema and this repository's own copies (offline);
      # the comparison with every listed repository's main is conformance-live.yml
      - name: Test the shared-file checker and its generator
        run: |
          python3 scripts/test_shared_files_check.py
          python3 scripts/test_gen_shared_files.py

      # the line-number reference baseline only goes down (each manifest holds exactly its count; the roster's
      # comparison with every main is conformance-live.yml)
      - name: The line-number reference baseline does not rise (tests, then check against main)
        run: |
          python3 scripts/test_line_refs_ratchet.py
          python3 scripts/test_line_refs_propose.py
          git fetch -q --depth 1 origin main
          base="$RUNNER_TEMP/base-line-refs-baseline.toml"
          if git cat-file -e FETCH_HEAD:conformance/line-refs-baseline.toml 2>/dev/null; then
            git show FETCH_HEAD:conformance/line-refs-baseline.toml > "$base"
          else
            rm -f "$base"
          fi
          python3 scripts/line_refs_ratchet.py --baseline conformance/line-refs-baseline.toml --base "$base"

      # pending rows only go down: a change may not add one against the table on main
      - name: The shared-file table reads, this repository's copies equal it, pending does not rise
        run: |
          git fetch -q --depth 1 origin main
          if git cat-file -e FETCH_HEAD:conformance/shared-files.toml 2>/dev/null; then
            git show FETCH_HEAD:conformance/shared-files.toml > "$RUNNER_TEMP/base-shared-files.toml"
            python3 scripts/shared_files_check.py --table conformance/shared-files.toml \
              --base-table "$RUNNER_TEMP/base-shared-files.toml" --lock-file .github/workflows/conformance-live.yml
          else
            echo "main has no conformance/shared-files.toml yet: no ratchet base"
            python3 scripts/shared_files_check.py --table conformance/shared-files.toml --lock-file .github/workflows/conformance-live.yml
          fi
          python3 scripts/shared_files_check.py --table conformance/shared-files.toml --repo . --name ALICE-Law

      - name: Test main mode (the requirement raise and what verify counts)
        run: python3 scripts/test_main_mode.py

      # the committed conformance state alone (it parses, covers exactly the train's crates,
      # counts sum to the gates); the comparison with the members' mains is conformance-live.yml,
      # so a manifest landing in another repository does not fail this repository's change
      - name: The committed conformance state is consistent
        run: python3 scripts/conformance_roster_check.py --internal

      - name: Test the README Status generator
        run: python3 scripts/test_gen_law_status.py

      - name: The README Status section is the generated one
        run: python3 scripts/gen_law_status.py --check

      - name: Test the README parity checker
        run: python3 scripts/test_readme_parity_check.py

      - name: README.md and README_JP.md agree where a translation must not differ
        run: python3 scripts/readme_parity_check.py

      - name: Test the README integration block generator
        run: python3 scripts/test_gen_law_readme_block.py

      # the strict workflow reader that workflow_concurrency.py reads the workflows with
      - name: Test the strict workflow reader (scripts/changed_paths.py, shared with the crates' CI)
        run: python3 scripts/test_changed_paths.py

      - name: Every branch-triggered workflow has a concurrency group per commit on main
        run: |
          python3 scripts/test_workflow_concurrency.py
          python3 scripts/workflow_concurrency.py

      - name: A --locked step that may follow a failed lock file generation requires its success
        run: |
          python3 scripts/test_locked_lockfile_check.py
          python3 scripts/locked_lockfile_check.py

      - name: Test the conformance measurement
        run: python3 scripts/test_measure_conformance.py

      # G15: the checker the crates run (fetched at a named revision), its baseline (generated, shrink-only)
      - name: Test the surface-claims check (G15) and its baseline
        run: python3 scripts/test_surface_claims_check.py

      # every file under conformance/ is read by a checker that runs on a ci/ branch (a conformance file whose
      # readers run on main only is red); the crates' reader is tested here, it runs in crates-conformance-ci.yml
      - name: Every conformance file has a reader on ci/** (tests, then the check)
        run: |
          python3 scripts/test_reader_map_core.py
          python3 scripts/test_conformance_reader_map.py
          python3 scripts/conformance_reader_map.py
          python3 scripts/test_crates_conformance_ci.py

      # the publish gate runs cargo semver-checks; its tests run the real tool on two
      # small crates (a breaking change under a minor version must be refused). The
      # release binary is pinned by version and SHA-256, and the toolchain is the one
      # that version reads the rustdoc JSON of.
      - name: Install cargo-semver-checks 0.50.0
        env:
          URL: https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.50.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
          SHA256: 52a65dc88dc53fa8b57d6087954eb52cda149ca03bcfca78ce3fdecd23f893c4
        run: |
          curl -fsSL "$URL" -o "$RUNNER_TEMP/csc.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/csc.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/csc.tar.gz" -C "$HOME/.cargo/bin" cargo-semver-checks
          rustup toolchain install 1.98.1 --profile minimal
          RUSTUP_TOOLCHAIN=1.98.1 cargo semver-checks --version

      # the release train (release-train.toml): its tests, and what the roster says
      # is next (informational here; the publisher runs `publish-gate <crate>` right
      # before each `cargo publish`)
      - name: Test the release train
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python3 scripts/test_release_train.py

      - name: Test the semver gate (scripts/semver_gate.py, shared with the crates' CI)
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python3 scripts/test_semver_gate.py

      - name: Test the release baseline (scripts/release_baseline.py, the semver gate's base under a freeze)
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python3 scripts/test_release_baseline.py

      - name: Test the expected-failure wrapper
        run: python3 scripts/test_expected_failure.py

      - name: Every expected failure is a step a workflow runs
        run: python3 scripts/expected_failure.py --check

      - name: Release train, next crate (informational)
        run: python3 scripts/release_train.py next || true

      - name: Compare the requirement matching with the semver crate
        run: python3 scripts/semver_differential.py

      - name: Resolve against crates.io as it is today
        run: |
          cargo --version
          cargo generate-lockfile
          echo "Changes to the committed Cargo.lock:"
          git diff --stat -- Cargo.lock

      - name: Check
        shell: bash
        run: |
          set +e
          python3 scripts/expected_failure.py dependency-consistency -- python3 scripts/dep_consistency.py --roster release-train.toml > "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md"
          exit "$rc"

  g11-table-check:
    # G11: the per-crate table of each pass gate's checker, canary, compared-nothing test and shared rows
    # (conformance/g11.toml in a crate, which fetches this checker and its generator at a pin and runs them
    # on ubuntu, macOS and Windows), so their tests run on the same three
    name: Test the G11 table checker and generator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Test the G11 table checker
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_g11_table_check.py

      - name: Test the G11 table generator
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_g11_table_gen.py

      - name: Test the G11 self-check
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_g11_self_check.py

      # a text-mode subprocess call decodes git's output with the locale's code page (cp1252 on
      # Windows) unless it names its encoding; the scripts a crate runs at its pin read UTF-8 files
      - name: Every text-mode subprocess call names its encoding (tests, then check)
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_subprocess_encoding_check.py
          "$py" scripts/subprocess_encoding_check.py

      # the shared harness the crates' checker tests judge their cases with: a crash is reported
      # as a crash (also with the expected exit code and text), a failing case names its text
      - name: Test the checker case harness
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/test_checker_case.py
