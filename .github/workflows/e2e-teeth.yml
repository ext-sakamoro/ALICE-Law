# The mutations the end to end check has to catch, from the core crates' main branches
#
# Each mutation (scripts/e2e_teeth.py) changes one line in a checkout of a core crate and requires the test in
# e2e/ to fail with the expected message; the test is rebuilt for each, so this runs on demand and on a push that
# changes the check or the mutations, never on a schedule. It is its own workflow so that its gate needs every job:
# the daily round trip (e2e-main.yml) runs without it.

name: End to end teeth (main)

on:
  workflow_dispatch:
  push:
    # no paths here: the changes job compares with merge-base(origin/main) (patterns: .github/paths/e2e-teeth.txt)
    branches: [main, "ci/**"]

permissions:
  contents: read

concurrency:
  group: e2e-teeth-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REPOSITORIES: ALICE-DetMath ALICE-Crypto ALICE-Zip ALICE-Analytics ALICE-DB ALICE-Physics ALICE-SDF ALICE-LOL ALICE-Edge ALICE-LLM

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main), another push with
  # before..after; a schedule or manual run always runs; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --patterns-file .github/paths/e2e-teeth.txt

  teeth:
    name: Mutations the test has to catch (main)
    # rebuilds the test once per mutation: on demand and when the check changes
    if: needs.changes.outputs.run == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Check out the main branches side by side
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          echo "| repository | main |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for r in $REPOSITORIES; do
            git clone --quiet --depth 1 "https://github.com/ext-sakamoro/$r.git" "$RUNNER_TEMP/core/$r"
            echo "| $r | $(git -C "$RUNNER_TEMP/core/$r" rev-parse --short HEAD) |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Patch the core crates with the checkouts
        id: patch
        run: |
          python3 scripts/main_mode.py patch "$RUNNER_TEMP/core"
          cd e2e && cargo --version
          python3 ../scripts/expected_failure.py e2e-main-patch -- cargo generate-lockfile
      - name: Mutations
        if: steps.patch.outputs.expected != 'true'
        run: python3 scripts/e2e_teeth.py "$RUNNER_TEMP/core" | tee -a "$GITHUB_STEP_SUMMARY"

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, teeth]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
