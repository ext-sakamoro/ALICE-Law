# The public text baseline on a ci/ branch that changes it or its readers
#
# Conformance (live) reads conformance/public-text-baseline.toml daily on main; a ci/ change to the baseline or to
# its readers would otherwise reach main before anything read it. This runs the same check
# (scripts/public_text_live.py over every public repository of the account, this repository at the commit under
# test) with main's baseline and with this change's (scripts/live_baseline_delta.py): what the change makes worse,
# and an unreadable repository, are red; another repository's new finding is the daily run's.

name: Public text baseline (ci)

on:
  push:
    branches: ["ci/**"]
    paths:
      - "conformance/public-text-baseline.toml"
      - "scripts/public_text_live.py"
      - "scripts/public_text_check.py"
      - "scripts/test_public_text_live.py"
      - "scripts/live_baseline_delta.py"
      - "scripts/test_live_baseline_delta.py"
      - ".github/workflows/public-text-baseline-ci.yml"

permissions:
  contents: read

concurrency:
  group: public-text-baseline-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-text:
    name: Every public repository against the public text baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      # 3.14, as the daily job: the checker reads zstd streams with the standard library
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Test the public text reader
        run: python3 scripts/test_public_text_live.py

      - name: Test what a baseline change makes worse
        run: python3 scripts/test_live_baseline_delta.py

      # the check with main's baseline and with this change's: only a finding this change adds is red (another
      # repository's new finding or a stale entry the daily run on main reports is not this change's)
      - name: The public repositories' text against the baseline, as far as this change goes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin main:refs/remotes/origin/main
          python3 scripts/live_baseline_delta.py --checker scripts/public_text_live.py --baseline conformance/public-text-baseline.toml --self "${GITHUB_REPOSITORY#*/}"
