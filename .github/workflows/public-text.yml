# The text this public repository publishes (files, paths, commit messages) carries no
# internal vocabulary: scripts/public_text_check.py on the tree and on the pushed commits.
name: Public text

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a superseded run on a branch is cancelled; on main each commit keeps its own run
concurrency:
  group: public-text-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0

      # 3.14: the checker reads zstd streams with the standard library (compression.zstd)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Test the checker
        run: python scripts/test_public_text_check.py

      - name: Test the name key (made-up keys only)
        run: python scripts/test_name_key.py

      - name: Test the licence files checker
        run: python scripts/test_licence_files_check.py

      - name: Test the rights-holder reader of the public repositories
        run: python scripts/test_holder_live.py

      - name: Test the public text reader of the public repositories
        run: python scripts/test_public_text_live.py

      # the declared licences have their full texts in this repository; the rights-holder rule against
      # conformance/holder-baseline.toml, which may not grow against the base scripts/ci_base.py names (main
      # before the push on a push to main, the merge-base with main elsewhere)
      - name: The licence files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=$(python scripts/ci_base.py --event "$EVENT" --ref "$GITHUB_REF" --before "$BEFORE")
          python scripts/licence_files_check.py --repo . --holder-base-ref "$base"

      # the private-name tables are HMAC under the repository secret: a push and a manual run need it (without it
      # the check fails, --require-private-names); a pull request from a fork gets no secret, so there the
      # private-name checks are skipped with a notice and every other check runs
      - name: The name key is in no tracked file
        env:
          ALICE_PRIVATE_NAME_HMAC_KEY: ${{ secrets.ALICE_PRIVATE_NAME_HMAC_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          req=--require-key
          if [ "$EVENT" = pull_request ]; then req=; fi
          python scripts/name_key_absent.py $req

      - name: The tree
        env:
          ALICE_PRIVATE_NAME_HMAC_KEY: ${{ secrets.ALICE_PRIVATE_NAME_HMAC_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          req=--require-private-names
          if [ "$EVENT" = pull_request ]; then req=; fi
          python scripts/public_text_check.py --tree HEAD $req

      - name: The pushed commits
        env:
          ALICE_PRIVATE_NAME_HMAC_KEY: ${{ secrets.ALICE_PRIVATE_NAME_HMAC_KEY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          req=--require-private-names
          if [ "$EVENT" = pull_request ]; then req=; fi
          base=$(python scripts/ci_base.py --event "$EVENT" --ref "$GITHUB_REF" --before "$BEFORE")
          if [ "$(git rev-list --count "$base..HEAD")" -gt 0 ]; then
            python scripts/public_text_check.py --range "$base..HEAD" $req
          else
            echo "no new commit (base $base is HEAD)"
          fi
