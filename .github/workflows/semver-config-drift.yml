# Each run of scripts/semver_gate.py in a roster repository's CI reads a config that is a copy of
# the crate's roster entry (every roster repository is checked out for it).
#
# Dormant: runs only when the workflow is dispatched.

name: Semver gate configs (main)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semver-config-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Each semver_gate config is a copy of its roster entry (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Each semver_gate config is a copy of its roster entry (main)
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          for r in $(python3 -c "import tomllib; print(' '.join(sorted({c['repo'] for c in tomllib.load(open('release-train.toml', 'rb'))['crate'].values() if 'repo' in c})))"); do
            git clone --quiet --depth 1 "https://github.com/ext-sakamoro/$r.git" "$RUNNER_TEMP/core/$r"
          done
          python3 scripts/release_train.py semver-config-drift --repos-root "$RUNNER_TEMP/core" --at HEAD | tee -a "$GITHUB_STEP_SUMMARY"
