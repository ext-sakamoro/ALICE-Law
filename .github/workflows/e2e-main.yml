# End to end check of the core ALICE crates, from their main branches
#
# The same test as e2e.yml, with every core crate replaced by a checkout of its
# repository's main branch (scripts/main_mode.py). An early warning: it says what the
# next releases would do to the round trip and to the golden digest, and it fails
# when a crate on main is not taken (its version does not fit what the others
# require, so Cargo keeps the release from crates.io).
#
# The teeth job changes one line at a time in the checkouts and requires the test
# to fail with the expected message (scripts/e2e_teeth.py); it rebuilds the test for
# each change, so it runs on demand and when the test or the mutations change.
#
# Weekly and on demand, and on a push that changes the check. One run at a time;
# the teeth job waits for the round trip and does not run on the weekly schedule.

name: End to end (main)

on:
  schedule:
    - cron: "47 5 * * 1"   # Mondays 05:47 UTC
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - "e2e/**"
      - "scripts/main_mode.py"
      - "scripts/e2e_teeth.py"
      - "scripts/expected_failure.py"
      - "release-train.toml"
      - "scripts/release_train.py"
      - "scripts/semver_gate.py"
      - ".github/workflows/e2e-main.yml"

permissions:
  contents: read

concurrency:
  group: e2e-main-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REPOSITORIES: ALICE-DetMath ALICE-Crypto ALICE-Zip ALICE-Analytics ALICE-DB ALICE-Physics ALICE-SDF ALICE-LOL ALICE-Edge ALICE-LLM

jobs:
  roundtrip:
    name: Read, compute, save, restore, compare (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - &clone
        name: Check out the main branches side by side
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          echo "| repository | main |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for r in $REPOSITORIES; do
            git clone --quiet --depth 1 "https://github.com/ext-sakamoro/$r.git" "$RUNNER_TEMP/core/$r"
            echo "| $r | $(git -C "$RUNNER_TEMP/core/$r" rev-parse --short HEAD) |" >> "$GITHUB_STEP_SUMMARY"
          done
      # a crate that declares consumer feature sets builds and semver-checks only those:
      # each feature of its manifest on main is in a set or excluded with a reason
      - name: Consumer feature sets cover every feature (main)
        run: python3 scripts/release_train.py feature-coverage --repos-root "$RUNNER_TEMP/core" | tee -a "$GITHUB_STEP_SUMMARY"
      # each run of scripts/semver_gate.py in a roster repository's CI reads a config that is
      # a copy of the crate's roster entry (every roster repository is checked out for it)
      - name: Each semver_gate config is a copy of its roster entry (main)
        run: |
          for r in $(python3 -c "import tomllib; print(' '.join(sorted({c['repo'] for c in tomllib.load(open('release-train.toml', 'rb'))['crate'].values() if 'repo' in c})))"); do
            [ -d "$RUNNER_TEMP/core/$r" ] || git clone --quiet --depth 1 "https://github.com/ext-sakamoro/$r.git" "$RUNNER_TEMP/core/$r"
          done
          python3 scripts/release_train.py semver-config-drift --repos-root "$RUNNER_TEMP/core" --at HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      # a failure the roster lists under [expected-failure.*] (named, explained, until a
      # release) is reported as expected and skips the steps that need it; any other is red
      - &patch
        name: Patch the core crates with the checkouts
        id: patch
        run: |
          python3 scripts/main_mode.py patch "$RUNNER_TEMP/core"
          cd e2e && cargo --version
          python3 ../scripts/expected_failure.py e2e-main-patch -- cargo generate-lockfile

      # first, so a core crate that comes from crates.io beside its checkout (a member whose main does
      # not accept another member's main) is named with its requirers before the build fails on it
      - name: Every core crate taken from main
        if: steps.patch.outputs.expected != 'true'
        run: python3 scripts/main_mode.py verify | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: always() && steps.patch.outputs.expected != 'true'
        working-directory: e2e
        run: cargo test --release --locked -- --nocapture

  teeth:
    name: Mutations the test has to catch (main)
    # rebuilds the test once per mutation: on demand and when the check changes.
    # Runs after the round trip whatever its result (a crate not taken from main
    # fails that job, and says nothing about the teeth)
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    needs: roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - *clone
      - *patch
      - name: Mutations
        if: steps.patch.outputs.expected != 'true'
        run: python3 scripts/e2e_teeth.py "$RUNNER_TEMP/core" | tee -a "$GITHUB_STEP_SUMMARY"

  digest:
    # f32::max / f32::min leave the sign of an equal-zero result to the target, and
    # x86_64 and aarch64 differ: the same run must give the same digest on both
    name: Digest on ${{ matrix.arch }} (main)
    needs: roundtrip
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - *clone
      - *patch
      - name: Test and record the digest
        if: steps.patch.outputs.expected != 'true'
        working-directory: e2e
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          ALICE_LAW_E2E_DIGEST_OUT="$RUNNER_TEMP/digest-${{ matrix.arch }}" cargo test --release --locked -- --nocapture
          cat "$RUNNER_TEMP/digest-${{ matrix.arch }}"
      - if: steps.patch.outputs.expected != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error

  digest-compare:
    name: The same digest on both architectures (main)
    needs: digest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Compare
        run: |
          n=$(ls digests | wc -l)
          test "$n" -eq 2 || { echo "expected 2 digests, found $n"; exit 1; }
          cat digests/*
          a=$(cat digests/digest-arm64); b=$(cat digests/digest-x86_64)  # "<alice-det-math version> <digest>"
          test -n "$a" && test "$a" = "$b" || { echo "aarch64 and x86_64 differ"; exit 1; }
          # main mode writes the values digest (the law records are main's format, compared in
          # the test through the store): the golden is golden/values.digest
          grep -qxF -- "$a" e2e/golden/values.digest || { echo "both differ from the e2e/golden/values.digest line for their alice-det-math release"; exit 1; }
          echo "aarch64 = x86_64 = golden: $a" >> "$GITHUB_STEP_SUMMARY"
