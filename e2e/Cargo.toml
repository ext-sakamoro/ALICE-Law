[package]
name = "alice-law-e2e"
version = "0.0.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"
description = "End to end check across the core ALICE crates: read a law, compute, save, restore, compare bit for bit"

# The core crates from their main branches (git, branch = "main", with the version on main):
# the check is what the crates on main compute, read, save and restore. The CI checks the
# repositories out side by side and patches these sources with the checkouts
# (scripts/main_mode.py), so the mutations of scripts/e2e_teeth.py reach the test.
[dependencies]
alice-lol = { git = "https://github.com/ext-sakamoro/ALICE-LOL", branch = "main", version = "0.5", features = ["physics"] }
alice-physics = { git = "https://github.com/ext-sakamoro/ALICE-Physics", branch = "main", version = "4", default-features = false, features = ["std"] }
alice-sdf = { git = "https://github.com/ext-sakamoro/ALICE-SDF", branch = "main", version = "7" }
alice-db = { git = "https://github.com/ext-sakamoro/ALICE-DB", branch = "main", version = "0.7" }
alice-zip = { git = "https://github.com/ext-sakamoro/ALICE-Zip", branch = "main", version = "0.12" }
alice-crypto = { git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main", version = "0.7" }
alice-analytics = { git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", version = "0.7", features = ["law"] }
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", branch = "main", version = "0.6" }
alice-edge = { git = "https://github.com/ext-sakamoro/ALICE-Edge", branch = "main", version = "0.5", default-features = false, features = ["std", "law"] }

[dev-dependencies]
# folds each crate's identifier pins (the procedure of alice-det-math's fold)
sha2 = "0.10"

[workspace]

[package.metadata.alice]
surfaces = ["rust"]
