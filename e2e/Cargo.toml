[package]
name = "alice-law-e2e"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "End to end check across the core ALICE crates: read a law, compute, save, restore, compare bit for bit"

# The published releases the check is written against. `alice-lol` 0.4 is the first
# release with the research law reader used here. Main mode (scripts/main_mode.py)
# patches these with the main branches of the eight repositories.
[dependencies]
alice-lol = { version = "0.4", features = ["physics"] }
alice-physics = { version = "2.2", default-features = false, features = ["std"] }
alice-sdf = "5.1"
alice-db = "0.3"
alice-zip = "0.9"
alice-crypto = "0.4.1"
alice-analytics = { version = "0.4", features = ["law"] }
alice-det-math = "0.4"

[workspace]
