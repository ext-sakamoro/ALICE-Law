# The gates `docs/CONFORMANCE.md` describes, in the form a generator reads.
#
# This file defines the gates themselves (id, name, one-line definition, the
# kinds of evidence a `pass` may cite, and which status values are valid for
# this gate). It does not say which crate passes which gate: that comes from
# each crate's own `alice-law-conformance.toml`, at its repository root, one
# entry per gate here, in the shape `docs/CONFORMANCE.md`'s "Manifest"
# section describes (status / evidence / since / note / reference_repo).
#
# status_vocabulary is the same four values for every gate: "pass",
# "fail-known" (checked, unmet), "unverified" (not checked) and "n/a"; the
# fields each status needs are in docs/CONFORMANCE.md's "Manifest" section.
# checked_by says whether a gate is decided by a machine check, a machine
# check plus a human audit of part of it, or an audit alone.

schema_version = 0
status_vocabulary = ["pass", "fail-known", "unverified", "n/a"]
# read as "unverified", with a warning, until the release-train manifests are rewritten
legacy_status = ["missing"]

[[gate]]
id = "G1"
checked_by = "machine"
name = "no-libm-direct"
definition = "The f32/f64 methods listed as banned in this gate's methods list (platform transcendentals and other results IEEE 754 does not require correctly rounded) are not called outside alice-det-math; sqrt and mul_add are allowed (correctly rounded); powi is pending a cross-target measurement and banned by default (a crate allowing it states the reason in its manifest; alice-det-math has an f32 powi only)."
evidence_kinds = ["clippy-disallowed-methods-type-resolved", "canary-test"]
# the f32 / f64 methods G1 rules on, owned here: "banned" outside alice-det-math, "allowed",
# or "pending" (not decided yet; its "default" says what a crate does unless its manifest states a
# reason); a crate's clippy configuration must
# ban every "banned" entry (a justified subset only with a reason in the crate's manifest)
methods = [
    { name = "sin", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "cos", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "tan", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "sin_cos", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "asin", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "acos", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "atan", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "atan2", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "sinh", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "cosh", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "tanh", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "asinh", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "acosh", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "atanh", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "exp", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "exp2", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "exp_m1", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "ln", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "log", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "log2", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "log10", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "ln_1p", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "powf", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "cbrt", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "hypot", verdict = "banned", reason = "not correctly rounded by IEEE 754; platform libm results differ" },
    { name = "sqrt", verdict = "allowed", reason = "correctly rounded by IEEE 754: every conforming platform gives the same bits" },
    { name = "mul_add", verdict = "allowed", reason = "fusedMultiplyAdd is correctly rounded (one rounding) per IEEE 754; on a target without a hardware fma in its default features (x86_64) it is a call into the platform library's fma, which IEEE 754 and C99 require correctly rounded; it is included in the cross-target measurement with powi; the sign of an outer negation is G3" },
    { name = "powi", verdict = "pending", default = "banned", reason = "integer power: a probe of 11,352 points (129 integer exponents x 44 bases, f32 and f64) found 0 differing results between aarch64 native and x86_64 code translated to run on the same arm64 floating-point unit, in debug and release; that is not evidence for real x86_64 hardware, and the grid is a structured sample; the cross-target question stays open, so the default is banned: a crate allowing powi states the reason in its manifest (alice-det-math provides powi for f32 only, so for f64 there is no det-math path yet)" },
    { name = "recip", verdict = "allowed", reason = "one correctly rounded division" },
    { name = "to_degrees", verdict = "allowed", reason = "one multiplication by a constant" },
    { name = "to_radians", verdict = "allowed", reason = "one multiplication by a constant" },
    { name = "abs", verdict = "allowed", reason = "exact" },
    { name = "copysign", verdict = "allowed", reason = "exact" },
    { name = "floor", verdict = "allowed", reason = "exact" },
    { name = "ceil", verdict = "allowed", reason = "exact" },
    { name = "round", verdict = "allowed", reason = "exact" },
    { name = "trunc", verdict = "allowed", reason = "exact" },
    { name = "fract", verdict = "allowed", reason = "exact (x - trunc(x))" },
    { name = "rem_euclid", verdict = "allowed", reason = "exact remainder" },
    { name = "div_euclid", verdict = "allowed", reason = "correctly rounded division then floor" },
]

[[gate]]
id = "G2"
checked_by = "machine and audit"
name = "ieee-max-min"
definition = "f32/f64 max/min must implement IEEE 754 maximumNumber/minimumNumber, at scalar width and at every SIMD width the crate builds for, via Law helpers and a default-deny manifest of named raw_* exceptions."
evidence_kinds = ["law-helper-source", "raw-helper-manifest", "simd-width-test-matrix"]

[[gate]]
id = "G3"
checked_by = "machine"
name = "no-outer-fneg-of-fma"
definition = "Negating the whole result of a fused multiply-add (a.mul_add(b,c)) is banned in every syntactic form; the Law-conforming form negates the fma's operands instead, (-a).mul_add(b, -c)."
evidence_kinds = ["syn-ast-checker", "macro-mention-hard-fail", "tests-examples-allowlist-with-reason"]

[[gate]]
id = "G4"
checked_by = "machine"
name = "debug-release-arch-goldens"
definition = "Signed-zero and exact-cancellation test cases are checked against fixed expected bit patterns under {debug, release} x {x86_64, aarch64}."
evidence_kinds = ["golden-test-file", "ci-matrix-leg-list"]

[[gate]]
id = "G5"
checked_by = "machine"
name = "release-profile-test-leg"
definition = "The full Law-bearing test suite runs under the release profile in CI; the aarch64 release leg is required (the one common target whose default codegen uses a hardware fma instruction)."
evidence_kinds = ["ci-workflow-required-leg"]

[[gate]]
id = "G6"
checked_by = "machine and audit"
name = "semantics-id"
definition = "Each crate computes an identifier folding its own Law pins with upstream crates' identifiers, guarded by its own version and toolchain so staleness is visible; the identifier attests the fingerprint, not that every call site routes through it (G1 attests that)."
evidence_kinds = ["semantics-id-source", "staleness-guard-test"]

[[gate]]
id = "G7"
checked_by = "machine and audit"
name = "handshake-carries-id"
definition = "A Law-bearing value crossing a crate boundary carries its producer's G6 identifier; a mismatch against the consumer's own identifier is an explicit, distinctly-typed error naming both identifiers."
evidence_kinds = ["handshake-error-type", "mismatch-test"]

[[gate]]
id = "G8"
checked_by = "machine and audit"
name = "persisted-semantics-id"
definition = "Law-bearing values written to a durable form carry their own identifier, distinct from G6's in-process one, describing the meaning of the stored bytes rather than the platform that wrote them."
evidence_kinds = ["persisted-id-format", "roundtrip-test"]

[[gate]]
id = "G9"
checked_by = "audit"
name = "persisted-meaning-change-is-major"
definition = "The G8 identifier is defined against the crate's reference platform; bringing another architecture to bit-for-bit agreement with it is a fix, not a bump. An actual meaning change moves the identifier and is recorded as semver-major."
evidence_kinds = ["changelog-major-entry", "identifier-history-test"]

[[gate]]
id = "G10"
checked_by = "machine"
name = "no-run-varying-artifacts"
definition = "Law-bearing output must not depend on an unseeded RNG, a freshly generated UUID, or an ambient wall-clock read; where randomness or time is part of the computation it is an explicit input."
evidence_kinds = ["determinism-test"]

[[gate]]
id = "G11"
checked_by = "machine"
name = "gate-self-tests"
definition = "Every gate's own checker carries: (a) a canary case it must flag, (b) a zero-compared-fails check, and (c) where a checker or helper is meant to be shared across crates, a cross-repository byte-identity check."
evidence_kinds = ["canary-test", "zero-scanned-fails-test", "cross-repo-identity-check"]

[[gate]]
id = "G12"
checked_by = "machine"
name = "public-repo-text-rules"
definition = "A crate's CI runs ALICE-Law's scripts/public_text_check.py (fetched at a named revision, or a byte-identical copy) on its repository, failing when it compared nothing; a crate's own checker counts only if it is that file."
evidence_kinds = ["public-text-check-ci-job"]

[[gate]]
id = "G13"
checked_by = "machine and audit"
name = "no-unspecified-order"
definition = "Law-bearing output must not depend on HashMap/HashSet iteration order, parallel-reduction combination order, or thread-count/address-dependent ordering."
evidence_kinds = ["order-independence-test"]

[[gate]]
id = "G14"
checked_by = "machine"
name = "float-environment-invariants"
definition = "Shipped Law-bearing artifacts are not built with fast-math-style flags or target-cpu=native; round-to-nearest-even and no-flush-to-zero are asserted by test, not assumed."
evidence_kinds = ["build-flags-check", "rne-no-ftz-assertion-test"]
