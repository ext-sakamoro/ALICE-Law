# ALICE-Law G11: the self-tests of each checker that conformance/shared-files.toml keeps byte-identical
# across crates. scripts/g11_table_gen.py writes a crate's conformance/g11.toml from this file: a crate
# gets a row for one of these checkers when its alice-law-conformance.toml names the checker in the
# evidence of a pass gate and the shared-files table lists the checker for that crate. The test files are
# shared too, so the same canary and zero hold in every crate that carries them.
#
#   path    the checker
#   canary  the test that plants a case the checker must flag
#   zero    the test that fails when the checker compared nothing
#   shared  the paths of the shared-files table that keep the checker and its tests identical (a crate
#           lists those of them the table lists for it)

[[checker]]
path = "scripts/api_boundary.py"
canary = "scripts/test_api_boundary.py::CheckTest.test_listed_items_pass_and_drift_fails"
zero = "scripts/test_api_boundary.py::CheckTest.test_nothing_enumerated_fails"
shared = ["scripts/api_boundary.py", "scripts/test_api_boundary.py"]

