]
required-ci = [
    { workflow = "CI", job = "Test", legs = ["Test (macos-latest)", "Test (macos-15-intel)", "Test (ubuntu-latest)", "Test (ubuntu-24.04-arm)", "Test (windows-latest)", "Test (wasm32-wasip1 via wasmtime)"] },
