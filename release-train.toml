# 0.5.1 は max / min / max64 / min64 を足し (算術の識別子が 135c407d… から 85e08846… に変わる)、0.5.0 の
# 識別子を PREVIOUS_SEMANTICS_IDS に残して check_semantics が検証済みの以前の識別子として受ける版
