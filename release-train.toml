# The release train of the core ALICE crates: which version each one is being
# released at, its place in the order, its state, and where it is.
#
# state:
#   published       on crates.io at `version` (scripts/release_train.py checks it)
#   prepared        the release commit is on a branch of the crate's repository,
#                   verified and green; it may be published once its upstreams are
#   prepared-local  the release is built locally against the planned upstreams, not
#                   pushed yet
#   planned         the version and requirements are the plan; nothing is built yet
#   exempt          not published (this repository: it checks the others)
#
# What a crate requires of the others is read from its Cargo.toml at the release
# checkout (`publish-gate --manifest`), not listed here, so there is one source for
# it. `order` is the order of the train: a crate comes after every crate it requires.
#
# The publisher updates `state` here in the same step as the publish, so this file
# is the plan the next publish is checked against:
#   python3 scripts/release_train.py next
#   python3 scripts/release_train.py publish-gate <crate> --manifest <its Cargo.toml>

[train]
# the crates.io owners every release must have, and no other (publish-verify)
owners = ["ext-sakamoro"]
# the GitHub owner of the repositories (required-ci reads the check runs of the commit there)
github = "ext-sakamoro"

[crate.alice-det-math]
version = "0.5.0"
state = "published"
order = 0
repo = "ALICE-DetMath"

[crate.alice-crypto]
version = "0.4.1"
state = "published"
order = 1
repo = "ALICE-Crypto"

[crate.alice-zip]
version = "0.10.0"
state = "published"
order = 2
repo = "ALICE-Zip"

[crate.alice-zip-cli]
# libalice: the CLI / FFI crate in ALICE-Zip/libalice, released with alice-zip
# (its Python wheel `libalice` follows the same version on PyPI)
version = "3.1.0"
state = "published"
order = 3
repo = "ALICE-Zip"
manifest-path = "libalice/Cargo.toml"
tag = "alice-zip-cli-v{version}"
# a CLI / FFI crate: not a library this repository links (scripts/dep_consistency.py CORE)
law-dependency = false

[crate.alice-analytics]
version = "0.5.0"
state = "published"
order = 4
repo = "ALICE-Analytics"

[crate.alice-db]
version = "0.4.0"
state = "published"
order = 5
repo = "ALICE-DB"

[crate.alice-physics]
version = "3.0.0"
state = "published"
order = 6
repo = "ALICE-Physics"
# 3.0.0 は等しいゼロの max / min を全 target で揃える変更を含めて公開する (x86_64 の
# 保存値が変わるが PHYSICS_SEMANTICS_ID は 3.0.0 の値のまま、公開後なら識別子の更新が要る)
# 変更の 2 commit (det_math の max / min と、lib の f32 / f64 max・min を禁じる clippy の gate) を
# patch id (git patch-id --stable) で持つ: rebase された写しでも当たる
must-contain-patch = [
    "713407beaf620dcc766632eab58d414d13146230",  # fix: 等しいゼロを max / min にかけた時の符号を全 target で揃える
    "12181a10bfd8ab5d0dfc5003f4bacd151154e79e",  # ci: library の code で f32 / f64 の max と min を使えなくする (wasm / python の lib pass を含む版)
]
changelog-has = ["**Behavior change:**"]
# CI jobs that must be green on the published commit, with every leg named: the tests
# on every OS and target (x86_64 and aarch64, wasm), clippy with the library gate (no
# f32 / f64 max and min), the wheel
required-ci = [
    { workflow = "CI", job = "Test", legs = [
        "Test (ubuntu-latest)", "Test (ubuntu-24.04-arm)", "Test (macos-latest)", "Test (macos-15-intel)",
        "Test (windows-latest)", "Test (WebAssembly binding from JavaScript)", "Test (wasm32-wasip1 via wasmtime)",
        "Test (neural / replay / analytics via crates.io siblings)",
    ] },
    { workflow = "CI", job = "Clippy" },
    { workflow = "Python binding", job = "Build, install and test the wheel" },
]
# 3.0.1 から (3.0.0 の commit には無い): 決定論試験の release leg (macos-latest は fma の分かれを
# 見る唯一の leg、ubuntu-24.04-arm と ubuntu-latest も) を、その job が main に入って workflow 名と
# leg 名が確定した時に `since = "3.0.1"` の entry として足す

[crate.alice-sdf]
version = "6.0.0"
state = "planned"
order = 7
repo = "ALICE-SDF"
# 6.0.0 は main の min / max の Law (77bcbaf まで) と、その上の det-math 0.5・physics 3・max / min の
# 2 周目の変更を含めて公開する (後者は patch id で持つ: rebase された写しでも当たる)
must-contain = ["77bcbaf1d3a318d660b93b9f32468f7d78b1bead"]
must-contain-patch = [
    "db667f3fc8beb9916c306c0a1e76709ebe5238a1",  # deps: alice-det-math 0.5、version 6.0.0
    "662232e39bd46ac984a62e121acb15946f2495e6",  # jit: simd_sincos_det を det-math 0.5 の範囲還元に
    "c9b523f749dc45163eb379fc1f9ba51319f991d2",  # deps: alice-physics 3、alice-det-math を 1 版に
    "82d65ad8870621f7f456e6ccf96309d1dd0aed34",  # library の f32 / f64 / f32x8 の max・min を Law / raw に
    "dd393a4a7d8dcd3c3343754c504457ee81424518",  # prim_table_simd の SIMD max・min を Law に
    "3af712708a9b776764fbcc03eddb8fd13fbc681f",  # Real::max / min (f32x8) を比較と blend に
    "05a3b69dcba43e5983b3d04505b9ff7ac073bdef",  # f32x8 の Law min / max の NaN の組
    "306c6d2ae597a5519cbf3f3f028d9df926f6c574",  # libm の allow の下に残っていた max・min
    "282a6edf2faea1ee7a7c58c052a3dfc72feb0802",  # ci: library の max・min を禁じる clippy と canary
    "6c9b1d77801ac9340ebe3077ff7428c6d7e2c6ff",  # ci: raw max/min の manifest を default-deny に
]
changelog-has = [
    "**破壊的変更:** `alice-det-math` を 0.4 から 0.5 に更新",
    "`alice-physics` の要求を 2.2 から 3 に上げた",
    "**Behavior change:**",
]
required-ci = [
    { workflow = "CI", job = "Test — Linux (x86_64)" },
    { workflow = "CI", job = "Test — macOS (ARM64)" },
    { workflow = "CI", job = "Test — Windows (x86_64)" },
    { workflow = "CI", job = "Clippy (core strict, -D warnings)" },
    { workflow = "CI", job = "Wiring guard", legs = ["Wiring guard (ubuntu-latest)", "Wiring guard (macos-latest)", "Wiring guard (windows-latest)"] },
    { workflow = "CI", job = "Format" },
    { workflow = "CI", job = "MSRV (rust-version = 1.85)" },
    { workflow = "CI", job = "Doc (RUSTDOCFLAGS=-Dwarnings)" },
    { workflow = "CI", job = "Bridges (each feature alone, no stubs)" },
    { workflow = "CI", job = "GPU parity (lavapipe)" },
    { workflow = "Security & Hygiene", job = "Package integrity (publish される .crate が build できるか)" },
    { workflow = "Security & Hygiene", job = "Stub / mock / dbg guard (grep)" },
    { workflow = "Security & Hygiene", job = "cargo audit (RustSec CVE scan)" },
    { workflow = "Security & Hygiene", job = "cargo-deny (license + advisories + bans + sources)" },
    { workflow = "Security & Hygiene", job = "cargo-machete (unused dependencies)" },
    { workflow = "Fuzz", job = "Fuzz — fuzz_asdf_decode" },
    { workflow = "Fuzz", job = "Fuzz — fuzz_bincode_roundtrip" },
    { workflow = "Fuzz", job = "Fuzz — fuzz_eval_parity" },
    { workflow = "Fuzz", job = "Fuzz — fuzz_sdf_eval" },
]

[crate.alice-lol-macro]
version = "0.3.0"
state = "planned"
order = 8
repo = "ALICE-LOL"
tag = "alice-lol-macro-v{version}"

[crate.alice-lol]
version = "0.4.0"
state = "planned"
order = 9
repo = "ALICE-LOL"
tag = "alice-lol-v{version}"
# the geometry digests on every OS, debug and release
required-ci = [
    { workflow = "CI", job = "Geometry digests", legs = [
        "Geometry digests (ubuntu-latest)", "Geometry digests (ubuntu-latest --release)",
        "Geometry digests (windows-latest)", "Geometry digests (windows-latest --release)",
        "Geometry digests (macos-latest)", "Geometry digests (macos-latest --release)",
    ] },
]

[crate.alice-edge]
version = "0.2.0"
state = "planned"
order = 10
# 0.2.0 は alice-sdf 6 を要求して公開する (optional でも: publish-gate は roster の版を受けない要求を
# 拒否する、test_an_optional_requirement_on_an_older_major_is_refused)
repo = "ALICE-Edge"

[crate.alice-law-integration]
version = "0.0.0"
state = "exempt"
order = 11
repo = "ALICE-Law"

# Problems of the dependency consistency check (scripts/dep_consistency.py --roster)
# that a release still to come removes. Each entry names the release (`until`); once
# the roster marks it published, the entry is stale and the check fails until the
# entry is removed (and the requirements that release lets this repository raise are
# raised). An item that matches no problem fails the check too.

[pending.alice-sdf-6]
until = "alice-sdf 6.0.0"
why = "alice-sdf 5.1.1 requires the previous alice-det-math and, with its physics feature, alice-physics 2.2 (which brings the previous alice-det-math, alice-analytics and alice-db requirements)"
linked = ["alice-det-math"]
requires = [
    "alice-sdf 5.1.1 -> alice-det-math ^0.4",
    "alice-sdf 5.1.1 -> alice-physics ^2.2",
    "alice-physics 2.2.0 -> alice-analytics ^0.1",
    "alice-physics 2.2.0 -> alice-db ^0.3.0-beta.1",
    "alice-physics 2.2.0 -> alice-det-math ^0.4",
]

[pending.alice-lol-0-4]
until = "alice-lol 0.4.0"
why = "alice-lol 0.3.0 requires alice-sdf 1.x and an alice-physics pre-release, which bring their own dependencies"
linked = ["alice-physics", "alice-sdf"]
requires = [
    "alice-lol 0.3.0 -> alice-physics ^0.14.0-preview.4",
    "alice-lol 0.3.0 -> alice-sdf ^1.9.0",
    "alice-sdf 1.13.0 -> alice-physics ^1.1",
    "alice-physics 0.14.0-preview.8 -> alice-analytics ^0.1",
    "alice-physics 0.14.0-preview.8 -> alice-db ^0.2.0-beta.1",
]

# CI steps that fail until a release (scripts/expected_failure.py, wrapped around the
# step): reported as expected and the steps that need them skipped. A step listed here
# that passes, or still fails after its release, or fails another way, is red.

[expected-failure.e2e-published-lol-0-4]
step = "e2e-published-resolve"
exit = 101
until = "alice-lol 0.4.0"
expect = ["failed to select a version for the requirement `alice-lol = \"^0.4\"`"]
why = "the end to end crate needs alice-lol 0.4 (its research law reader), which is not on crates.io yet"

[expected-failure.e2e-main-lol-physics-3]
step = "e2e-main-patch"
exit = 101
until = "alice-lol 0.4.0"
expect = ["failed to select a version for the requirement `alice-physics = \"^2.0\"`"]
why = "alice-lol on main requires alice-physics ^2.0 while alice-physics on main is 3.0.0; alice-lol 0.4.0 raises it"

[pending.alice-edge-0-2]
until = "alice-edge 0.2.0"
why = "alice-edge 0.1.1 requires the previous alice-analytics, alice-db, alice-sdf and alice-zip; with its db feature it brings alice-db 0.2.0-beta.3 and, through it, alice-zip 0.4 and alice-analytics 0.1"
linked = ["alice-analytics", "alice-db", "alice-zip"]
requires = [
    "alice-edge 0.1.1 -> alice-analytics ^0.1",
    "alice-edge 0.1.1 -> alice-db ^0.2.0-beta.2",
    "alice-edge 0.1.1 -> alice-sdf ^1.9",
    "alice-edge 0.1.1 -> alice-zip ^0.5",
    "alice-db 0.2.0-beta.3 -> alice-analytics ^0.1",
    "alice-db 0.2.0-beta.3 -> alice-crypto ^0.1",
    "alice-db 0.2.0-beta.3 -> alice-zip ^0.4",
]
