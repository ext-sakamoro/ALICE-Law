# The Actions secrets of each repository in the train, by name, with what they are for:
# publish-gate reads the repository's secrets and refuses a secret that is not listed here, a
# publishing credential outside an environment with required reviewers, and a job that receives
# a publishing secret on a release / tag / dispatch / schedule trigger outside such an
# environment. An environment secret is listed as "<environment>:<name>".
[secrets."ALICE-SDF"]
UNITY_LICENSE = { purpose = "the Unity licence of the Unity package build and tests", publishing = false }

# The Actions variables of each repository, by name, with what they are for (a variable is plain
# text and never holds a credential); an environment variable is listed as "<environment>:<name>".
# A job on a self-hosted runner that runs on a release / tag / dispatch / schedule trigger outside
# an environment with required reviewers is listed under [self-hosted."<repository>"] as
# "<workflow file>:<job>" with registry-credentials-on-host = false, which says the host holds no
# registry credential (a claim reviewed with the entry).
[variables."ALICE-SDF"]
UE5_RUNNER = { purpose = "turns the Unreal Engine job on (\"true\") when the Windows runner with the engine is online" }
UE5_ENGINE_ROOTS = { purpose = "the engine install folders (a JSON list) the Unreal Engine job builds against" }

# Problems of the dependency consistency check (scripts/dep_consistency.py --roster)
# that a release still to come removes. Each entry names the release (`until`); once
# the roster marks it published, the entry is stale and the check fails until the
# entry is removed (and the requirements that release lets this repository raise are
# raised). An item that matches no problem fails the check too.

[pending.alice-lol-0-4]
until = "alice-lol 0.4.0"
why = "alice-lol 0.3.0 requires alice-sdf 1.x and an alice-physics pre-release, which bring their own dependencies"
linked = ["alice-physics", "alice-sdf"]
requires = [
    "alice-lol 0.3.0 -> alice-physics ^0.14.0-preview.4",
    "alice-lol 0.3.0 -> alice-sdf ^1.9.0",
    "alice-sdf 1.13.0 -> alice-physics ^1.1",
    "alice-physics 0.14.0-preview.8 -> alice-analytics ^0.1",
    "alice-physics 0.14.0-preview.8 -> alice-db ^0.2.0-beta.1",
]

# CI steps that fail until a release (scripts/expected_failure.py, wrapped around the
# step): reported as expected and the steps that need them skipped. A step listed here
# that passes, or still fails after its release, or fails another way, is red.

[expected-failure.e2e-published-lol-0-4]
step = "e2e-published-resolve"
exit = 101
until = "alice-lol 0.4.0"
expect = ["failed to select a version for the requirement `alice-lol = \"^0.4\"`"]
why = "the end to end crate needs alice-lol 0.4 (its research law reader), which is not on crates.io yet"

[expected-failure.e2e-main-lol-physics-3]
step = "e2e-main-patch"
exit = 101
until = "alice-lol 0.4.0"
expect = ["failed to select a version for the requirement `alice-physics = \"^2.0\"`"]
why = "alice-lol on main requires alice-physics ^2.0 while alice-physics on main is 3.0.0; alice-lol 0.4.0 raises it"

