# Problems of the dependency consistency check (scripts/dep_consistency.py --roster)
# that a change still to come removes. Each entry names the version that removes it
# (`until = "<crate> <version>"`); once the roster records that crate at that version or
# later, the entry is stale and the check fails until the entry is removed. An item that
# matches no problem fails the check too.

