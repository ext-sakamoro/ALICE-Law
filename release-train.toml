# The core ALICE crates at commits of their main branches: for each one, the version its
# manifest has at that commit, its place in the order and its repository. Nothing is
# published to crates.io; consumers take each crate from its repository's main branch.
#
# state:
#   main     the crate at `sha`, a commit of its repository's main branch, whose manifest has
#            `version` (scripts/release_train.py check)
#   exempt   not a crate of the train (this repository: it checks the others)
#
# `sha` and `version` are written by `python3 scripts/release_train.py record`, never by
# hand: a repository the end to end check records (e2e/golden/values.provenance) takes the
# commit recorded there, the others the head of main. Re-record after the e2e bless.
# What a crate requires of the others is read from its Cargo.toml at `sha`. `order` is the
# order of the train: a crate comes after every crate it requires.
#   python3 scripts/release_train.py check --repos-root <dir of checkouts>
#   python3 scripts/release_train.py record --repos-root <dir of checkouts>

[train]
# the GitHub owner of the repositories (check reads the main CI runs of each commit there)
github = "ext-sakamoro"

[crate.alice-det-math]
version = "0.6.1"
sha = "d80446ebce73c5c397f7df12435cf574460400bf"
state = "main"
order = 0
repo = "ALICE-DetMath"

[crate.alice-crypto]
version = "0.7.0"
sha = "33496b48d145c3008de83bc521eba19cbf95c72e"
state = "main"
order = 1
repo = "ALICE-Crypto"

[crate.alice-zip]
version = "0.11.0"
sha = "c498e1769a71532239aed179e918734dd6329d8a"
state = "main"
order = 2
repo = "ALICE-Zip"

[crate.alice-zip-cli]
# libalice: the CLI / FFI crate in ALICE-Zip/libalice, released with alice-zip
# (its Python wheel `libalice` follows the same version on PyPI)
version = "4.0.0"
sha = "c498e1769a71532239aed179e918734dd6329d8a"
state = "main"
order = 3
repo = "ALICE-Zip"
consumer-features = [["cli", "codec"]]
consumer-features-why = "python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["python"]]
manifest-path = "libalice/Cargo.toml"
# a CLI / FFI crate: not a library this repository links (scripts/dep_consistency.py CORE)
law-dependency = false

[crate.alice-analytics]
version = "0.7.0"
sha = "cf16e1928fae6b73fa3c3e2792aa687175a29267"
state = "main"
order = 4
repo = "ALICE-Analytics"

[crate.alice-db]
version = "0.6.0"
sha = "5db2b15cb148aeed1bd83cb1479a0989ab2a044e"
state = "main"
order = 5
repo = "ALICE-DB"
consumer-features = [["analytics", "crypto", "ffi", "fs", "open-file-audit", "sdf"]]
consumer-features-why = "python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["python"]]

[crate.alice-physics]
version = "4.0.0"
sha = "8ea9fb86194670419332c2a4484b84b7dd675f2c"
state = "main"
order = 10
repo = "ALICE-Physics"
manifest-path = "crates/alice-physics/Cargo.toml"
consumer-features = [["analytics", "ffi", "gpu-solver-bridge", "neural", "parallel", "privacy-crypto", "simd", "std"], ["std", "wasm"]]
consumer-features-why = "python は std を有効にしない (no_std では compile できない) ので std と組にする wasm と ffi は互いに排他 (src/lib.rs の compile_error) なので別の組にする python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["std", "python"]]

[crate.alice-sdf]
version = "7.0.0"
sha = "0d5830e3f2c6fece513c5e6aa9fd2e4ea7c76962"
state = "main"
order = 11
repo = "ALICE-SDF"
consumer-features = [["aaa", "all-shaders", "asp", "blinkscript", "cli", "codec", "destruction", "ffi", "font", "gi", "glsl", "godot", "gpu", "gpu-mesh", "hlsl", "image", "jit", "msl", "openvdb", "physics", "rust", "sdf-cache", "svo", "svo-gpu", "terrain", "texture-fit", "unity", "unreal", "volume", "wasm"]]
consumer-features-why = "python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["python"]]

[crate.alice-llm]
version = "5.0.0"
sha = "be521bda68c5bf70557d51e63b70ed7d21eb3cb2"
state = "main"
order = 6
repo = "ALICE-LLM"
law-dependency = false

[crate.alice-lol-macro]
