repo = "ALICE-LOL"
manifest-path = "alice-lol-macro/Cargo.toml"

[crate.alice-lol]
version = "0.5.0"
sha = "0008b70326810e4874168d9b94b78010348c3e88"
state = "main"
order = 14
repo = "ALICE-LOL"
manifest-path = "alice-lol/Cargo.toml"

[crate.alice-edge]
version = "0.5.0"
sha = "719bf8b4f92fa464f8b76b727bbfcb913ea5f2c3"
state = "main"
order = 12
repo = "ALICE-Edge"
consumer-features = [["asp", "codec", "dashboard", "db", "depth-camera", "edge-pipeline", "ffi", "law", "ml", "mqtt", "pyo3", "sdf", "sensors", "serde-raw", "std", "zip"]]
consumer-features-why = "外す feature: sensors-hw (rppal は特定の Linux board の GPIO 専用で他の target では build できない)"
exclude-features = { sensors-hw = "rppal は特定の Linux board の GPIO 専用で、他の target では build できない" }

[crate.alice-law-integration]
