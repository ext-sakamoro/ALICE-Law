# The release train of the core ALICE crates: which version each one is being
# released at, its place in the order, its state, and where it is.
#
# state:
#   published       on crates.io at `version` (scripts/release_train.py checks it)
#   prepared        the release commit is on a branch of the crate's repository,
#                   verified and green; it may be published once its upstreams are
#   prepared-local  the release is built locally against the planned upstreams, not
#                   pushed yet
#   planned         the version and requirements are the plan; nothing is built yet
#   exempt          not published (this repository: it checks the others)
#
# What a crate requires of the others is read from its Cargo.toml at the release
# checkout (`publish-gate --manifest`), not listed here, so there is one source for
# it. `order` is the order of the train: a crate comes after every crate it requires.
#
# The publisher updates `state` here in the same step as the publish, so this file
# is the plan the next publish is checked against:
#   python3 scripts/release_train.py next
#   python3 scripts/release_train.py publish-gate <crate> --manifest <its Cargo.toml>

[train]
# the crates.io owners every release must have, and no other (publish-verify)
owners = ["ext-sakamoro"]
# the GitHub owner of the repositories (required-ci reads the check runs of the commit there)
github = "ext-sakamoro"

[crate.alice-det-math]
version = "0.5.0"
state = "published"
order = 0
repo = "ALICE-DetMath"

[crate.alice-crypto]
version = "0.4.1"
state = "published"
order = 1
repo = "ALICE-Crypto"

[crate.alice-zip]
version = "0.10.0"
state = "published"
order = 2
repo = "ALICE-Zip"

[crate.alice-zip-cli]
# libalice: the CLI / FFI crate in ALICE-Zip/libalice, released with alice-zip
# (its Python wheel `libalice` follows the same version on PyPI)
version = "3.1.0"
state = "published"
order = 3
repo = "ALICE-Zip"
consumer-features = [["cli", "codec"]]
consumer-features-why = "python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["python"]]
manifest-path = "libalice/Cargo.toml"
tag = "alice-zip-cli-v{version}"
# a CLI / FFI crate: not a library this repository links (scripts/dep_consistency.py CORE)
law-dependency = false

[crate.alice-analytics]
version = "0.5.0"
state = "published"
order = 4
repo = "ALICE-Analytics"

[crate.alice-db]
version = "0.4.0"
state = "published"
order = 5
repo = "ALICE-DB"
consumer-features = [["analytics", "crypto", "ffi", "fs", "open-file-audit", "sdf"]]
consumer-features-why = "python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["python"]]
consumer-expected-failure = [{ features = ["python"], expect = { code = "E0308", file = "src/lib.rs", text = "arr", count = 1, label = "expected `ArrayBase<OwnedRepr<f64>, ..., f64>`, found `ArrayBase<OwnedRepr<f64>, ...>`", message = "mismatched types" }, until = "alice-db 0.4.1", why = "0.4.0 の python は新規解決で numpy と alice-db が別の版の ndarray を引き src/lib.rs の PyArray2::from_owned_array が型不一致になる" }]

[crate.alice-physics]
version = "3.0.0"
state = "published"
order = 6
repo = "ALICE-Physics"
consumer-features = [["analytics", "ffi", "gpu-solver-bridge", "neural", "parallel", "privacy-crypto", "replay", "simd", "std"], ["std", "wasm"]]
consumer-features-why = "python は std を有効にしない (3.0.0、no_std では compile できない) ので std と組にする wasm と ffi は互いに排他 (src/lib.rs の compile_error) なので別の組にする python は cargo check で見る (PyO3 の extension module で link は maturin が行う、cargo build の cdylib link は -undefined dynamic_lookup が無く macOS で失敗する)"
consumer-check-features = [["std", "python"]]
# 3.0.0 は等しいゼロの max / min を全 target で揃える変更を含めて公開する (x86_64 の
# 保存値が変わるが PHYSICS_SEMANTICS_ID は 3.0.0 の値のまま、公開後なら識別子の更新が要る)
# 変更の 2 commit (det_math の max / min と、lib の f32 / f64 max・min を禁じる clippy の gate) を
# patch id (git patch-id --stable) で持つ: rebase された写しでも当たる
must-contain-patch = [
    "713407beaf620dcc766632eab58d414d13146230",  # fix: 等しいゼロを max / min にかけた時の符号を全 target で揃える
    "12181a10bfd8ab5d0dfc5003f4bacd151154e79e",  # ci: library の code で f32 / f64 の max と min を使えなくする (wasm / python の lib pass を含む版)
]
changelog-has = ["**Behavior change:**"]
# CI jobs that must be green on the published commit, with every leg named: the tests
# on every OS and target (x86_64 and aarch64, wasm), clippy with the library gate (no
# f32 / f64 max and min), the wheel
required-ci = [
    { workflow = "CI", job = "Test", legs = [
        "Test (ubuntu-latest)", "Test (ubuntu-24.04-arm)", "Test (macos-latest)", "Test (macos-15-intel)",
        "Test (windows-latest)", "Test (WebAssembly binding from JavaScript)", "Test (wasm32-wasip1 via wasmtime)",
        "Test (neural / replay / analytics via crates.io siblings)",
    ] },
    { workflow = "CI", job = "Clippy" },
    { workflow = "Python binding", job = "Build, install and test the wheel" },
]
# 3.0.1 から (3.0.0 の commit には無い): 決定論試験の release leg (macos-latest は fma の分かれを
# 見る唯一の leg、ubuntu-24.04-arm と ubuntu-latest も) を、その job が main に入って workflow 名と
# leg 名が確定した時に `since = "3.0.1"` の entry として足す

