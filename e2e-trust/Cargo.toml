[package]
name = "alice-law-e2e-trust"
version = "0.0.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"
description = "End to end check of the trust path: issue a device certificate, sign a law, carry it over an authenticated channel under a Sync handshake, evaluate it, store and restore it, compare bit for bit"

# These crates are not on crates.io, so this package runs in main mode only
# (scripts/main_mode.py --package e2e-trust patches every one with its main branch);
# each names its main branch (the lock CI generates records the commits), and the file does not build outside
# main mode (alice-lol names its siblings by path, ../../ALICE-Sign and others). The published-mode
# check (e2e/, .github/workflows/e2e.yml) does not depend on them.
[dependencies]
alice-identity = { version = "1.2.0", git = "https://github.com/ext-sakamoro/ALICE-Identity", branch = "main" }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", branch = "main" }
alice-channel = { version = "0.1.0", git = "https://github.com/ext-sakamoro/ALICE-Channel", branch = "main", features = ["async"] }
alice-sync = { version = "0.7.0", git = "https://github.com/ext-sakamoro/ALICE-Sync", branch = "main", features = ["secure-transport"] }
alice-lol = { version = "0.5.0", git = "https://github.com/ext-sakamoro/ALICE-LOL", branch = "main" }
alice-zip = { version = "0.11", git = "https://github.com/ext-sakamoro/ALICE-Zip", branch = "main", default-features = false }
alice-db = { version = "0.6.0", git = "https://github.com/ext-sakamoro/ALICE-DB", branch = "main", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
# turned on by scripts/main_mode.py in the CI checkout (the same switch as e2e/)
main-mode = []

[workspace]
