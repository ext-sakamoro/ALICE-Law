[package]
name = "alice-law-integration"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
description = "Integration checks across the core ALICE crates, built from their crates.io releases"

# The core crates, at their latest releases, with the features that turn on
# their dependencies on each other (so the lock file shows every link between
# them). No path dependencies: everything comes from crates.io.
[dependencies]
alice-lol = { version = "0.3", features = ["physics"] }
alice-det-math = "0.4"
alice-sdf = { version = "5.1", features = ["physics"] }
alice-physics = { version = "2.2", features = ["analytics", "replay"] }
alice-db = { version = "0.3.0-beta.2", features = ["analytics", "crypto"] }
alice-zip = "0.8"
alice-crypto = "0.4"
alice-analytics = { version = "0.3", features = ["law"] }

[workspace]
